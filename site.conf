# Go 后端：使用 compose 服务名，端口与 Go 应用监听一致（常见 8080/8081/8999）
upstream time_go {
    server timemanager_go:8999;
}

# Vue 前端开发态 dev server
upstream time_vue {
    server vue:5173;
}

server {
    index index.php;
    server_name time.local;
    root /code/public;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Vue 独立路径：http://localhost:8080/static/time_manager_vue/ 走 Vue，其余走 PHP
    location /static/time_manager_vue/ {
        proxy_pass http://time_vue/static/time_manager_vue/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /static/time_manager_vue;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        autoindex on;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    location /time_manage_go {
        proxy_pass http://time_go;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

