services:
    web:
        image: time_manage_nginx:1.0
        ports:
            - "8080:80"
        volumes:
            - ./:/code
            - ./site.conf:/etc/nginx/conf.d/time_manager.conf
        depends_on:
            - vue

    php:
        image: time_manage_php:1.0
        volumes:
            - ./:/code

    timemanager_go:
       image: time_manage_go:1.0
       volumes:
         - ./:/time_manage
         # 与 Laravel 共用 session：必须挂载到 Go 实际读取的路径（conf 里 session.path 请设为 /app/session_storage）
         - ./storage/framework/sessions:/app/session_storage
         - /Users/caozilong/Documents/go/src/github.com/fantasyczl/time_manager_go/conf:/app/conf
         - /Users/caozilong/Documents/go/src/github.com/fantasyczl/time_manager_go/log:/app_run/log
       environment:
         - SESSION_PATH=/app/session_storage
         - APP_KEY=${APP_KEY:-}

    db:
        image: time_manage_mysql:1.0
        command: --default-authentication-plugin=mysql_native_password
        restart: always
        volumes:
            - /Users/caozilong/Docker/images/time_manager_mysql/create_table.sql:/docker-entrypoint-initdb.d/init.sql
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root1234
            MYSQL_DATABASE: time_manage
            MYSQL_USER: time_manager
            MYSQL_PASSWORD: 1234

    # Vue 前端 (time_manager_vue)，使用 docker/vue.Dockerfile，开发态 dev server
    vue:
        build:
            context: /Users/caozilong/Documents/Vue.js/workspace/time_manager_vue
            dockerfile: Dockerfile
            args:
                VUE_APP_DIR: ${VUE_APP_DIR:-time_manager_vue}
        container_name: time_test_vue
        restart: unless-stopped
        ports:
            - "5173:5173"
        volumes:
            # 与 build context 一致，否则 /app 会挂到错误目录导致无 package.json
            - ${VUE_APP_PATH:-/Users/caozilong/Documents/Vue.js/workspace/time_manager_vue}:/app
            - vue_node_modules:/app/node_modules
        environment:
            VITE_API_BASE: http://localhost:8080/time_manage_go
            VITE_BASE_PATH: /static/time_manager_vue/
        depends_on:
            - timemanager_go

volumes:
    vue_node_modules: